name: Publish to gh-pages

# GitHub Pages для этого репозитория раздаёт ветку gh-pages (корень).
# Каждый пуш в main копирует содержимое сайта в gh-pages, Pages пересобирает страницу сам.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: ".github,.agents,docs,PRODUCT.md,DESIGN.md,README.md"
          force_orphan: true
          commit_message: "Publish site from main"
